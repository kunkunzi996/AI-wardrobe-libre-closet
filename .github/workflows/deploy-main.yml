name: Deploy main to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate miniapp shell
        run: npm run test:miniapp

      - name: Build backend and assets
        run: npm run build

  deploy:
    name: Deploy main
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_MAIN == 'true' }}
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ai-wardrobe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package deployment image
        run: docker save ai-wardrobe:latest | gzip -1 > /tmp/ai-wardrobe.tar.gz

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" /tmp/ai-wardrobe.tar.gz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ai-wardrobe.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd /root/AI-wardrobe-libre-closet

          cp .env /root/ai-wardrobe.env.backup
          for attempt in $(seq 1 5); do
            if git fetch --depth=20 origin +refs/heads/main:refs/remotes/origin/main; then
              echo "git fetch succeeded on attempt ${attempt}."
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "git fetch failed after ${attempt} attempts."
              exit 1
            fi
            echo "git fetch failed on attempt ${attempt}; retrying in 10 seconds..."
            sleep 10
          done
          git switch main
          git merge --ff-only origin/main
          git log --oneline -3
          cp /root/ai-wardrobe.env.backup /root/AI-wardrobe-libre-closet/.env

          gzip -dc /tmp/ai-wardrobe.tar.gz | docker load
          rm -f /tmp/ai-wardrobe.tar.gz
          docker rm -f ai-wardrobe || true
          docker run -d \
            --name ai-wardrobe \
            -p 127.0.0.1:3000:3000 \
            --env-file /root/AI-wardrobe-libre-closet/.env \
            -v ai_wardrobe_data:/app/data \
            ai-wardrobe:latest

          docker ps --filter name=ai-wardrobe
          docker logs --tail=80 ai-wardrobe
          REMOTE_SCRIPT

      - name: Public health check
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://aimatchwear.asia/ > /dev/null; then
              echo "Public health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Public health check failed on attempt ${attempt}; retrying in 5 seconds..."
            sleep 5
          done

          echo "Public health check failed after 12 attempts."
          exit 1
