name: Github Actions CI
on: [push]

env:
  NODE_VERSION: "22.x" # set this to the node version to use

jobs:
  back-end-ci:
    name: back-end-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 包含固定版 MinIO 首次源码编译，所有检查仍完整执行
    steps:
      - uses: actions/checkout@master

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm install & build
        run: |
          npm install
          npm run build

      - name: npm format:check
        run: |
          npm run format:check

      - name: npm lint
        run: |
          npm run lint

      - name: npm test:cov
        run: |
          npm run test:cov

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: npm test:e2e:smoke local
        run: |
          npm run test:e2e:smoke
        env:
          CI: true
          APP_NAME: Lazztech.Boilerplate
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: sqlite
          FILE_STORAGE_TYPE: local

      - name: npm test:load local
        run: |
          npm run test:load
        env:
          CI: true
          APP_NAME: Lazztech.Boilerplate
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: sqlite
          FILE_STORAGE_TYPE: local

      - name: start postgresql db
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: "11" # See https://hub.docker.com/_/postgres for available versions
          postgresql db: "postgres-test"
          postgresql user: "test"
          postgresql password: "Password123"

      - name: Use Go for MinIO test storage
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false

      - name: start minio s3 object storage
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
          GOTOOLCHAIN: local
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: |
          # 官方社区版仅分发源码；固定发布提交，不依赖已失效的镜像或浮动 latest。
          go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$GOBIN/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          minio_pid=$!

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$minio_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::测试对象存储启动失败或未就绪"
            tail -n 60 "$RUNNER_TEMP/minio.log"
            exit 1
          fi

          export AWS_ACCESS_KEY_ID=minioadmin
          export AWS_SECRET_ACCESS_KEY=minioadmin
          export AWS_EC2_METADATA_DISABLED=true

          aws --endpoint-url http://127.0.0.1:9000/ s3 mb s3://test-lazztech-boilerplate

      - name: npm test:e2e:smoke remote
        run: |
          npm run test:e2e:smoke
        env:
          CI: true
          APP_NAME: Lazztech.Boilerplate
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: "test"
          DATABASE_PASS: "Password123"
          DATABASE_SCHEMA: "postgres-test"
          DATABASE_SSL: "false"
          FILE_STORAGE_TYPE: object
          OBJECT_STORAGE_BUCKET_NAME: test-lazztech-boilerplate
          OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
          OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000

      - name: npm test:load remote
        run: |
          npm run test:load
        env:
          CI: true
          APP_NAME: Lazztech.Boilerplate
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: "test"
          DATABASE_PASS: "Password123"
          DATABASE_SCHEMA: "postgres-test"
          DATABASE_SSL: "false"
          FILE_STORAGE_TYPE: object
          OBJECT_STORAGE_BUCKET_NAME: test-lazztech-boilerplate
          OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
          OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000

      - name: upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: scripts/results/

      # Performance, best practices, and health check
      - name: run lighthouse
        run: npm run lighthouse

      - name: check for dependency updates
        run: npx npm-check-updates
